name: Download, build and run
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Maven 3.9.9
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz --output "$RUNNER_TEMP/maven.tar.gz"
          echo "a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          server-id: github-algoquant
          server-username: GITHUB_ACTOR
          server-password: NM_PACKAGES_TOKEN
      - name: Check AlgoQuant package access
        env:
          NM_PACKAGES_TOKEN: ${{ secrets.NM_PACKAGES_TOKEN || secrets.NM_REPOSITORIES_TOKEN || github.token }}
        run: |
          status=$(curl --silent --show-error --location --output "$RUNNER_TEMP/algoquant-metadata.xml" --write-out '%{http_code}' --user "$GITHUB_ACTOR:$NM_PACKAGES_TOKEN" https://maven.pkg.github.com/nmltd/algoquant/tech/nmfin/algoquant/3.3.0-SNAPSHOT/maven-metadata.xml)
          if [ "$status" != 200 ]; then
            echo "::error::AlgoQuant package access failed (HTTP $status). Grant nmltd/new-algoquant-project Actions read access to the AlgoQuant package, or add NM_PACKAGES_TOKEN / NM_REPOSITORIES_TOKEN with read:packages and access to nmltd/algoquant in this repository's Actions secrets."
            exit 1
          fi
      - name: Download AlgoQuant from an empty Maven cache, build and run
        env:
          NM_PACKAGES_TOKEN: ${{ secrets.NM_PACKAGES_TOKEN || secrets.NM_REPOSITORIES_TOKEN || github.token }}
        run: mvn -B -ntp -U -Dmaven.repo.local="$RUNNER_TEMP/m2" clean verify exec:java
      - name: Run the packaged application
        run: java -jar target/new-algoquant-project-0.0.1-SNAPSHOT.jar license/nm.lic
